<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2f3b2f" />
    <!-- iOS(아이패드/아이폰): 홈 화면에 추가했을 때 주소창 없이 전체화면으로. 사파리는 매니페스트 display 대신 이 태그를 본다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>열린 카페</title>
    <link rel="icon" href="/icon-kiosk-192.png" />
    <!-- 홈 화면에 추가하면 주소창 없는 전체화면 앱으로 뜬다. 화면별로 다른 매니페스트. -->
    <!-- 안드로이드 크롬은 매니페스트 icons 를, iOS 사파리는 apple-touch-icon 을 홈 화면 아이콘으로 쓴다. -->
    <script>
      var screen = location.pathname.startsWith('/staff') ? 'staff' : 'kiosk'
      document.write('<link rel="manifest" href="/' + screen + '.manifest.json">')
      document.write('<link rel="apple-touch-icon" href="/icon-' + screen + '-192.png">')
      document.write('<meta name="apple-mobile-web-app-title" content="' + (screen === 'staff' ? '열린 카페 스태프' : '열린 카페') + '">')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
